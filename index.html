<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktive Karte – Autobahn Route</title>
  <style>
    :root{
      --bg:#f3f4f6;
      --text:#111827;
      --muted:#6b7280;
      --green:#16a34a;
      --green-dark:#0f7a36;
      --border:#d1d5db;
      --autobahn:#2563eb;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    body{padding:24px}
    .page{width:min(1600px,100%);margin:auto}
    .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:16px}
    h1{margin:0 0 4px;font-size:clamp(1.35rem,2vw,2rem)}
    .topbar p,.hint{margin:0;color:var(--muted)}
    .counter{padding:9px 14px;border:1px solid var(--border);border-radius:999px;background:#fff;font-weight:700}
    .map-card{overflow:hidden;border:1px solid var(--border);border-radius:16px;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.08)}
    .map-stage{position:relative;width:100%;aspect-ratio:2/1;overflow:hidden;background:#fff}
    .map-image{display:block;width:100%;height:100%;object-fit:contain;user-select:none}
    .route-layer{position:absolute;inset:0;pointer-events:none;z-index:5}
    .markers-layer{position:absolute;inset:0;pointer-events:none;z-index:10}
    .route-shadow{fill:none;stroke:rgba(0,0,0,.20);stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
    .route-main{fill:none;stroke:var(--autobahn);stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
    .route-dashes{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14 12;opacity:.98}
    .map-marker{position:absolute;left:var(--x);top:var(--y);width:clamp(24px,1.8vw,34px);height:clamp(24px,1.8vw,34px);transform:translate(-50%,-50%);border:3px solid #fff;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px rgba(15,122,54,.95),0 4px 12px rgba(0,0,0,.28);cursor:pointer;pointer-events:auto;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
    .map-marker::after{content:"";position:absolute;inset:-8px;border:2px solid rgba(22,163,74,.33);border-radius:50%}
    .map-marker:hover,.map-marker:focus-visible,.map-marker[aria-expanded="true"]{z-index:20;transform:translate(-50%,-50%) scale(1.12);background:var(--green-dark);outline:none}
    .point-popup{position:absolute;z-index:30;left:var(--x);top:var(--y);min-width:148px;transform:translate(-50%,calc(-100% - 26px));padding:10px 12px;border-radius:10px;background:rgba(17,24,39,.96);color:#fff;font-weight:800;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:auto}
    .point-popup small{display:block;margin-top:4px;font-size:12px;font-weight:600;color:#cbd5e1}
    .point-popup::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;transform:translateX(-50%) rotate(45deg);background:rgba(17,24,39,.96)}
    .hint{padding:12px 2px 0;font-size:.9rem}
    @media(max-width:700px){body{padding:12px}.topbar{align-items:flex-start;flex-direction:column;gap:10px}.map-card{border-radius:12px;overflow-x:auto}.map-stage{min-width:900px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>Interaktive Karte</h1>
        <p>Klicke auf einen grünen Punkt. Alle Punkte 1–14 sind mit einer Autobahn-Route verbunden.</p>
      </div>
      <div class="counter"><span id="pointCount">14</span> Punkte</div>
    </header>

    <section class="map-card">
      <div class="map-stage" id="mapStage">
        <img class="map-image" src="images/Karte1.jpg" alt="Karte mit Strassennetz" draggable="false">
        <svg id="routeLayer" class="route-layer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="markersLayer" class="markers-layer"></div>
      </div>
    </section>

    <p class="hint">Die blaue Linie stellt die Autobahn-Verbindung von Punkt 1 bis Punkt 14 dar.</p>
  </main>

  <script>
    const points = [
      { id: 1,  x: 9.3262,  y: 19.6289, title: 'Punkt 1' },
      { id: 2,  x: 34.1309, y: 19.1406, title: 'Punkt 2' },
      { id: 3,  x: 59.3262, y: 19.6289, title: 'Punkt 3' },
      { id: 4,  x: 84.1309, y: 19.1406, title: 'Punkt 4' },
      { id: 5,  x: 24.4629, y: 39.9414, title: 'Punkt 5' },
      { id: 6,  x: 74.4629, y: 39.9414, title: 'Punkt 6' },
      { id: 7,  x: 46.9727, y: 49.6094, title: 'Punkt 7' },
      { id: 8,  x: 96.9727, y: 49.6094, title: 'Punkt 8' },
      { id: 9,  x: 1.3672,  y: 66.6992, title: 'Punkt 9' },
      { id: 10, x: 51.3672, y: 66.6992, title: 'Punkt 10' },
      { id: 11, x: 17.5293, y: 71.9727, title: 'Punkt 11' },
      { id: 12, x: 67.5293, y: 71.9727, title: 'Punkt 12' },
      { id: 13, x: 35.6934, y: 83.5938, title: 'Punkt 13' },
      { id: 14, x: 85.6934, y: 83.5938, title: 'Punkt 14' }
    ];

    const layer = document.getElementById('markersLayer');
    const routeLayer = document.getElementById('routeLayer');
    const stage = document.getElementById('mapStage');
    document.getElementById('pointCount').textContent = points.length;

    const routePath = points.map(point => `${point.x},${point.y}`).join(' ');
    routeLayer.innerHTML = `
      <polyline class="route-shadow" points="${routePath}"></polyline>
      <polyline class="route-main" points="${routePath}"></polyline>
      <polyline class="route-dashes" points="${routePath}"></polyline>
    `;

    let activeMarker = null;
    let activePopup = null;

    function closePopup() {
      if (activePopup) {
        activePopup.remove();
        activePopup = null;
      }
      if (activeMarker) {
        activeMarker.setAttribute('aria-expanded', 'false');
        activeMarker = null;
      }
    }

    function openPopup(point, marker) {
      const sameMarker = activeMarker === marker;
      closePopup();
      if (sameMarker) return;

      marker.setAttribute('aria-expanded', 'true');
      activeMarker = marker;

      const popup = document.createElement('div');
      popup.className = 'point-popup';
      popup.style.setProperty('--x', `${point.x}%`);
      popup.style.setProperty('--y', `${point.y}%`);
      popup.innerHTML = `${point.title}<small>Autobahn-Route – Station ${point.id}</small>`;
      layer.appendChild(popup);
      activePopup = popup;
    }

    points.forEach(point => {
      const marker = document.createElement('button');
      marker.type = 'button';
      marker.className = 'map-marker';
      marker.textContent = point.id;
      marker.style.setProperty('--x', `${point.x}%`);
      marker.style.setProperty('--y', `${point.y}%`);
      marker.setAttribute('aria-label', point.title);
      marker.setAttribute('aria-expanded', 'false');
      marker.addEventListener('click', event => {
        event.stopPropagation();
        openPopup(point, marker);
      });
      layer.appendChild(marker);
    });

    stage.addEventListener('click', closePopup);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closePopup();
    });
  </script>
</body>
</html>
