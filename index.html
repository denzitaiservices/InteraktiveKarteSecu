<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wirkkette EMS</title>
  <style>
    :root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb}
    *{box-sizing:border-box}
    html,body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
    body{padding:24px}
    .page{width:min(1600px,100%);margin:auto}
    header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
    h1{margin:0 0 4px;font-size:clamp(1.3rem,2vw,1.9rem)}
    header p{margin:0;color:var(--muted)}
    .tabs{display:flex;gap:6px;flex-wrap:wrap}
    .tab{display:flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--border);border-radius:999px;background:var(--card);
         font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;color:var(--text)}
    .tab i{width:12px;height:12px;border-radius:50%;background:var(--c)}
    .tab[aria-pressed="true"]{background:var(--text);color:#fff;border-color:var(--text)}

    .layout{display:grid;grid-template-columns:1fr 370px;gap:16px;align-items:start}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.07)}
    .map-card{overflow:auto}
    .stage{position:relative;min-width:780px;aspect-ratio:2/1;background:#e9ebe6}
    .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28;filter:grayscale(1);user-select:none}
    svg.net{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
    svg.net path{fill:none;stroke-linecap:round;stroke-linejoin:round}

    /* Strassen: zuerst alle Ränder, dann aller Asphalt -> Kreuzungen verschmelzen */
    .s-shadow{stroke:rgba(0,0,0,.18)}
    .s-edge{stroke:#fff}
    .s-asph{stroke:#4a4f55}
    .main.s-shadow{stroke-width:30}.main.s-edge{stroke-width:25}.main.s-asph{stroke-width:20}
    .side.s-shadow{stroke-width:19}.side.s-edge{stroke-width:15}.side.s-asph{stroke-width:11}
    .s-mark{stroke:rgba(255,255,255,.55);stroke-width:1.5;stroke-dasharray:7 9}

    /* Prozesswege als farbige Spur */
    .line{stroke:var(--c);stroke-width:5;opacity:.85;transition:opacity .25s,stroke-width .25s}
    .flow{stroke:#fff;stroke-width:2.2;stroke-dasharray:3 13;opacity:0;animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-16}}
    .net.focus .line{opacity:.12}
    .net.focus .line.on{opacity:1;stroke-width:7}
    .net.focus .flow.on{opacity:.95}

    .markers{position:absolute;inset:0}
    .m{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;
       background:#fff;border:4px solid var(--c);color:var(--text);font-weight:800;font-size:13px;cursor:pointer;z-index:3;
       box-shadow:0 3px 10px rgba(0,0,0,.35);transition:transform .15s,opacity .25s}
    .m:hover,.m:focus-visible{transform:translate(-50%,-50%) scale(1.15);outline:none}
    .m.active{transform:translate(-50%,-50%) scale(1.3);z-index:5;box-shadow:0 0 0 6px rgba(250,204,21,.6),0 4px 14px rgba(0,0,0,.4)}
    .m.dim{opacity:.35}
    .tag{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,22px);white-space:nowrap;background:#fff;color:var(--text);
         border-left:4px solid var(--c);font-size:11px;font-weight:700;padding:3px 7px;border-radius:4px;pointer-events:none;
         box-shadow:0 2px 6px rgba(0,0,0,.2);transition:opacity .25s;z-index:2}
    .tag.dim{opacity:0}
    .car{position:absolute;left:0;top:0;width:30px;height:16px;margin:-8px 0 0 -15px;z-index:6;pointer-events:none;
         filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));transition:opacity .25s}

    .panel{padding:20px;position:sticky;top:16px}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.75rem;font-weight:700;color:#fff;background:var(--c)}
    .panel h2{margin:10px 0 4px;font-size:1.3rem}
    .muted{color:var(--muted);font-size:.9rem;margin:0}
    .steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:4px}
    .steps button{width:100%;text-align:left;display:flex;gap:9px;align-items:center;padding:7px 9px;border:0;border-radius:9px;background:none;
                  font:inherit;font-size:.9rem;cursor:pointer;color:var(--text)}
    .steps button:hover{background:var(--bg)}
    .steps button.on{background:var(--bg);font-weight:700}
    .steps b{flex:none;width:24px;height:24px;border-radius:50%;border:3px solid var(--c);display:grid;place-items:center;font-size:.72rem}
    .detail{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
    .detail h3{margin:0 0 2px;font-size:1.05rem}
    .detail p.desc{margin:8px 0;line-height:1.5}
    .detail ul{margin:0;padding-left:18px;line-height:1.6}
    .in{font-size:.8rem;color:var(--muted);margin-top:10px}
    .nav{display:flex;gap:8px;margin-top:16px}
    .nav button{flex:1;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--card);font:inherit;font-weight:600;cursor:pointer;color:var(--text)}
    .nav button:disabled{opacity:.4;cursor:default}
    .hint{color:var(--muted);font-size:.85rem;margin:12px 2px 0}
    @media(max-width:1000px){.layout{grid-template-columns:1fr}.panel{position:static}}
    @media(max-width:600px){body{padding:12px}}
  </style>
</head>
<body>
<main class="page">
  <header>
    <div>
      <h1>Wirkkette EMS – Produkteinführung</h1>
      <p>Neubau &amp; Modernisierung · IST-Situation · Prozess wählen, dann Station anklicken oder ← → nutzen</p>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>

  <div class="layout">
    <section class="card map-card">
      <div class="stage" id="stage">
        <img src="Karte1.jpg" alt="" draggable="false" onerror="this.remove()">
        <svg class="net" id="net" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <g id="gShadow"></g><g id="gEdge"></g><g id="gAsph"></g><g id="gMark"></g><g id="gLines"></g>
        </svg>
        <div class="markers" id="markers"></div>
        <svg class="car" id="car" viewBox="0 0 30 16" aria-hidden="true">
          <rect x="1" y="1" width="28" height="14" rx="4.5" fill="#dc2626" stroke="#7f1d1d"/>
          <rect x="16" y="2.8" width="6" height="10.4" rx="2" fill="#bfdbfe"/>
          <rect x="6" y="3.2" width="4.5" height="9.6" rx="1.5" fill="#93c5fd"/>
          <circle cx="27.6" cy="3.6" r="1.2" fill="#fef9c3"/><circle cx="27.6" cy="12.4" r="1.2" fill="#fef9c3"/>
        </svg>
      </div>
    </section>
    <aside class="card panel" id="panel" aria-live="polite"></aside>
  </div>
  <p class="hint">Farbige Spuren = Prozesse · graue Strassen = Abzweigungen und Querverbindungen · Stationen mit mehreren Prozessen sind Kreuzungen.</p>
</main>

<script>
/* ===== Daten – hier anpassen ===== */
const stations = {
  1:{x:9.33, y:19.63, title:'Management-Entscheid', area:'Geschäftsleitung', desc:'Freigabe der Produkteinführung für Neubau und Modernisierung.', tasks:['Business Case prüfen','Budget und Termine freigeben','Verantwortliche bestimmen']},
  2:{x:24.46,y:39.94, title:'PM – Produktmanagement', area:'Produktmanagement', desc:'Definiert Anforderungen, Positionierung und Lebenszyklus.', tasks:['Markt- und Kundenanforderungen','Produktspezifikation','Roadmap & Lifecycle']},
  3:{x:3.5,  y:62.5,  title:'Produktentwicklung', area:'Entwicklung (PE)', desc:'Software und Hardware werden entwickelt und dokumentiert.', tasks:['Software','Hardware','Technische Dokumentation']},
  4:{x:17.53,y:71.97, title:'Testing PMS', area:'Entwicklung / Qualität', desc:'Prüfung und Freigabe vor dem Marktstart.', tasks:['System- und Integrationstests','Pilotanlagen','Freigabeprotokoll']},
  5:{x:35.69,y:83.59, title:'PE/PM Support', area:'Produktmanagement Support', desc:'Technische Begleitung während der Einführung.', tasks:['Supportprozesse aufsetzen','Know-how an Vertrieb','Erste Fälle begleiten']},
  6:{x:46.97,y:49.61, title:'Prozess Marktbearbeitung', area:'Produktmanagement / Marketing', desc:'Zielmärkte, Segmente und Preise werden festgelegt.', tasks:['Marktsegmente','Preisgestaltung','Wettbewerbsanalyse']},
  7:{x:34.13,y:19.14, title:'Prozess Markteinführung', area:'Produktmanagement / Marketing', desc:'Der Launch wird geplant und Promotionen umgesetzt.', tasks:['Launch-Plan','Umsetzung Promotionen','Verkaufsunterlagen']},
  8:{x:59.33,y:19.63, title:'MK – Marketing & Kommunikation', area:'Marketing', desc:'Das Produkt wird intern und extern kommuniziert.', tasks:['Produktseite Web','Kommunikation an Partner','Messen, Social Media, Presse']},
  9:{x:51.37,y:66.70, title:'Trainingsabteilung', area:'HR / Training', desc:'Mitarbeitende und Partner werden geschult.', tasks:['Schulung Vertrieb','Schulung Technik & Montage','Zertifizierungen']},
  10:{x:67.53,y:71.97,title:'Services', area:'Service', desc:'Wartung, Ersatzteile und Hotline sind bereit.', tasks:['Ersatzteillogistik','Serviceverträge','Hotline & Störungsdienst']},
  11:{x:74.46,y:39.94,title:'VCH – Vertrieb Schweiz', area:'Vertrieb', desc:'Der Vertrieb bringt das Produkt zum Kunden.', tasks:['Kunden ansprechen','Offerten erstellen','Projekte akquirieren']},
  12:{x:84.13,y:19.14,title:'Auftrag & Projektleitung', area:'Projektleitung', desc:'Aus der Anfrage wird ein Projekt.', tasks:['Anfrage prüfen','Budget und Qualität sichern','Projektplanung']},
  13:{x:95.5, y:49.61,title:'Montage & Inbetriebnahme', area:'Technik', desc:'Das System wird beim Kunden installiert.', tasks:['Montage','Inbetriebnahme','Abnahme mit Kunde']},
  14:{x:85.69,y:83.59,title:'Endkunde', area:'Neubau / Modernisierung', desc:'Das Produkt ist im Einsatz.', tasks:['Nutzung im Betrieb','Feedback','Rückspiel-Möglichkeiten (Personen, OS etc.) aufzeigen']}
};

// Prozesse = richtige Wege. Zahlen = Stationen, [x,y] = Kurvenpunkte dazwischen.
const processes = [
  {id:'entw', name:'Produktentwicklung', color:'#2563eb', desc:'Vom Entscheid bis zum freigegebenen und unterstützten Produkt.',
   path:[1,[17,27],2,[12,48],3,[9,72],4,[26,80],5]},
  {id:'markt', name:'Markteinführung', color:'#7c3aed', desc:'Das Produkt wird in den Markt gebracht und alle werden befähigt.',
   path:[2,[34,47],6,[42,34],7,[46,10],8,[57,43],9,[59,76],10]},
  {id:'vertrieb', name:'Vertrieb & Auftrag', color:'#ea580c', desc:'Vom Verkauf über das Projekt bis zur Anlage beim Kunden.',
   path:[8,[68,28],11,[79,30],12,[92,30],13,[96,68],14]},
  {id:'feedback', name:'Rückmeldung', color:'#16a34a', desc:'Erfahrungen vom Kunden fliessen zurück ins Produktmanagement.',
   path:[14,[66,92],[47,91],5,[30,62],2]}
];

// Abzweigungen / Querstrassen (nur grau, gehören zu keinem Prozess)
const sideStreets = [
  [[17,27],[7,33],[-3,37]],      [[12,48],[-3,53]],
  [[12,48],[22,57],[30,62]],     [[46,10],[44,-3]],
  [[42,34],[52,31],[57,43]],     [[57,43],[68,52],[81,58],[96,68]],
  [[59,76],[72,84],[85.69,83.59]],[[26,80],[28,92],[30,103]],
  [[79,30],[77,10],[75,-3]],     [[96,68],[104,73]],
  [[9,72],[5,88],[2,103]],       [[68,28],[66,10],[69,-3]],
  [[47,91],[45,103]],            [[92,30],[103,25]],
  [[51.37,66.7],[41,71],[30,62]],[[74.46,39.94],[86,47],[95.5,49.61]],
  [[24.46,39.94],[30,30],[34.13,19.14]], [[1,19],[9.33,19.63]], [[66,92],[68,103]]
];

/* ===== Aufbau ===== */
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const pt = p => Array.isArray(p) ? {x:p[0], y:p[1]} : stations[p];

// Catmull-Rom -> weiche Bezier-Kurve durch alle Punkte
function curve(points){
  const p = points.map(pt);
  let d = `M${p[0].x},${p[0].y}`;
  for (let i = 0; i < p.length - 1; i++){
    const a = p[i-1] || p[i], b = p[i], c = p[i+1], e = p[i+2] || c;
    d += ` C${b.x+(c.x-a.x)/6},${b.y+(c.y-a.y)/6} ${c.x-(e.x-b.x)/6},${c.y-(e.y-b.y)/6} ${c.x},${c.y}`;
  }
  return d;
}
function addPath(group, d, cls, extra = {}){
  const el = document.createElementNS(NS, 'path');
  el.setAttribute('d', d); el.setAttribute('class', cls);
  el.setAttribute('vector-effect', 'non-scaling-stroke');
  Object.entries(extra).forEach(([k,v]) => el.setAttribute(k, v));
  $(group).appendChild(el); return el;
}

const roads = [
  ...sideStreets.map(s => ({d: curve(s), kind:'side'})),
  ...processes.map(p => ({d: curve(p.path), kind:'main'}))
];
roads.forEach(r => {
  addPath('gShadow', r.d, `${r.kind} s-shadow`);
  addPath('gEdge',   r.d, `${r.kind} s-edge`);
  addPath('gAsph',   r.d, `${r.kind} s-asph`);
  if (r.kind === 'side') addPath('gMark', r.d, 's-mark');
});
processes.forEach(p => {
  p.el   = addPath('gLines', curve(p.path), 'line', {style:`--c:${p.color}`});
  p.flow = addPath('gLines', curve(p.path), 'flow');
  p.steps = p.path.filter(x => !Array.isArray(x));
});

// Position jeder Station entlang ihres Prozesswegs bestimmen
function lengthAt(path, s){
  const L = path.getTotalLength(); let best = 0, bd = Infinity;
  for (let i = 0; i <= 600; i++){
    const l = L * i / 600, q = path.getPointAtLength(l), dd = (q.x-s.x)**2 + (q.y-s.y)**2;
    if (dd < bd){ bd = dd; best = l; }
  }
  return best;
}
processes.forEach(p => p.lens = p.steps.map(id => lengthAt(p.el, stations[id])));

// Marker
const markerEls = {};
Object.entries(stations).forEach(([id, s]) => {
  const first = processes.find(p => p.steps.includes(+id));
  const m = document.createElement('button');
  m.type = 'button'; m.className = 'm'; m.textContent = id;
  m.style.cssText = `--x:${s.x}%;--y:${s.y}%;--c:${first.color}`;
  m.setAttribute('aria-label', s.title);
  m.onclick = () => pickStation(+id);
  const t = document.createElement('div');
  t.className = 'tag'; t.textContent = s.title;
  t.style.cssText = `--x:${s.x}%;--y:${s.y}%;--c:${first.color}`;
  $('markers').append(m, t);
  markerEls[id] = {m, t};
});

// Tabs
const tabEls = [...processes, {id:'alle', name:'Alle Prozesse', color:'#9ca3af'}].map(p => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tab';
  b.style.setProperty('--c', p.color);
  b.innerHTML = `<i></i>${p.name}`;
  b.onclick = () => p.id === 'alle' ? showAll() : selectProcess(p, 0);
  $('tabs').appendChild(b); return {id:p.id, b};
});

/* ===== Auto ===== */
const car = $('car'), stage = $('stage');
let carProc = null, carLen = 0, raf = null;
function placeCar(path, l, dir){
  const W = stage.clientWidth, H = stage.clientHeight, L = path.getTotalLength();
  const a = path.getPointAtLength(Math.max(0, Math.min(L, l)));
  const b = path.getPointAtLength(Math.max(0, Math.min(L, l + 0.6 * dir)));
  let ang = Math.atan2((b.y-a.y)*H, (b.x-a.x)*W) * 180 / Math.PI;
  if (l + 0.6*dir > L || l + 0.6*dir < 0) ang += 180;
  car.style.transform = `translate(${a.x*W/100}px,${a.y*H/100}px) rotate(${ang}deg)`;
}
function driveTo(proc, target){
  cancelAnimationFrame(raf);
  if (carProc !== proc){ carProc = proc; carLen = target; placeCar(proc.el, target, 1); return; }
  const from = carLen, dist = target - from, dir = dist >= 0 ? 1 : -1;
  const dur = Math.min(2600, 300 + Math.abs(dist) * 22), t0 = performance.now();
  const ease = t => t < .5 ? 2*t*t : 1 - (-2*t+2)**2/2;
  const tick = now => {
    const t = Math.min(1, (now - t0) / dur);
    carLen = from + dist * ease(t);
    placeCar(proc.el, carLen, dir);
    if (t < 1) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
window.addEventListener('resize', () => carProc && placeCar(carProc.el, carLen, 1));

/* ===== Ansicht ===== */
let cur = null, step = 0;

function selectProcess(p, i){
  cur = p; step = i;
  $('net').classList.add('focus');
  processes.forEach(q => { q.el.classList.toggle('on', q === p); q.flow.classList.toggle('on', q === p); });
  tabEls.forEach(t => t.b.setAttribute('aria-pressed', t.id === p.id));
  Object.entries(markerEls).forEach(([id, {m, t}]) => {
    const inP = p.steps.includes(+id);
    m.classList.toggle('dim', !inP); t.classList.toggle('dim', !inP);
    m.classList.toggle('active', +id === p.steps[i]);
    m.style.setProperty('--c', inP ? p.color : processes.find(q => q.steps.includes(+id)).color);
    t.style.setProperty('--c', inP ? p.color : '#ccc');
  });
  car.style.opacity = 1;
  driveTo(p, p.lens[i]);
  renderPanel();
}

function showAll(){
  cur = null;
  $('net').classList.remove('focus');
  processes.forEach(q => { q.el.classList.remove('on'); q.flow.classList.remove('on'); });
  tabEls.forEach(t => t.b.setAttribute('aria-pressed', t.id === 'alle'));
  Object.entries(markerEls).forEach(([id, {m, t}]) => {
    const c = processes.find(q => q.steps.includes(+id)).color;
    m.classList.remove('dim','active'); t.classList.remove('dim');
    m.style.setProperty('--c', c); t.style.setProperty('--c', c);
  });
  car.style.opacity = 0;
  $('panel').innerHTML = `<h2>Alle Prozesse</h2><p class="muted">Die Wirkkette besteht aus mehreren Prozessen, die sich an Kreuzungen treffen.</p>
    <ul class="steps">${processes.map((p, k) => `<li><button data-p="${k}" style="--c:${p.color}"><b>${p.steps.length}</b>${p.name}</button></li>`).join('')}</ul>`;
  $('panel').querySelectorAll('[data-p]').forEach(b => b.onclick = () => selectProcess(processes[+b.dataset.p], 0));
}

function pickStation(id){
  if (cur && cur.steps.includes(id)) return selectProcess(cur, cur.steps.indexOf(id));
  const p = processes.find(q => q.steps.includes(id));
  selectProcess(p, p.steps.indexOf(id));
}

function renderPanel(){
  const p = cur, id = p.steps[step], s = stations[id];
  const others = processes.filter(q => q !== p && q.steps.includes(id));
  $('panel').innerHTML = `
    <span class="badge" style="--c:${p.color}">Prozess</span>
    <h2>${p.name}</h2><p class="muted">${p.desc}</p>
    <ol class="steps">${p.steps.map((sid, k) => `<li><button data-k="${k}" class="${k === step ? 'on' : ''}" style="--c:${p.color}"><b>${sid}</b>${stations[sid].title}</button></li>`).join('')}</ol>
    <div class="detail">
      <h3>${id}. ${s.title}</h3><p class="muted">${s.area}</p>
      <p class="desc">${s.desc}</p>
      <ul>${s.tasks.map(t => `<li>${t}</li>`).join('')}</ul>
      ${others.length ? `<p class="in">Kreuzung mit: ${others.map(q => q.name).join(', ')}</p>` : ''}
    </div>
    <div class="nav"><button id="prev" type="button" ${step === 0 ? 'disabled' : ''}>← Zurück</button>
      <button id="next" type="button" ${step === p.steps.length - 1 ? 'disabled' : ''}>Weiter →</button></div>`;
  $('panel').querySelectorAll('[data-k]').forEach(b => b.onclick = () => selectProcess(p, +b.dataset.k));
  $('prev').onclick = () => selectProcess(p, step - 1);
  $('next').onclick = () => selectProcess(p, step + 1);
}

document.addEventListener('keydown', e => {
  if (!cur) return;
  if (e.key === 'ArrowRight' && step < cur.steps.length - 1) selectProcess(cur, step + 1);
  if (e.key === 'ArrowLeft' && step > 0) selectProcess(cur, step - 1);
});

selectProcess(processes[0], 0);
</script>
</body>
</html>
